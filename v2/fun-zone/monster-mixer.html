<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Monster Mixer!</title>
<style>
  :root {
    --font: 'Arial Rounded MT Bold','Nunito','Quicksand',system-ui,-apple-system,Arial,sans-serif;
    --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ink: #1a1a3e;
    --purple: #9333ea;
    --purple-dark: #5b21b6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100vh; height: 100dvh;
    overflow: hidden;
    font-family: var(--font);
    touch-action: manipulation;
    background: linear-gradient(160deg, #1a1a3e 0%, #3b0764 40%, #1e1b4b 100%);
    color: #fff;
  }

  /* ══════ BACK HOME ══════ */
  .back-home-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 10px);
    left: 10px; z-index: 9999;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: #fff;
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 15px; font-weight: 900;
    text-decoration: none;
    box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    transition: transform 0.15s;
  }
  .back-home-btn:active { transform: translateY(2px); }

  /* ══════ FLOATING BG BLOBS ══════ */
  .bg-blob {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    filter: blur(60px); opacity: 0.18;
    animation: blobDrift ease-in-out infinite;
  }
  @keyframes blobDrift {
    0%, 100% { transform: translate(0,0) scale(1); }
    50%       { transform: translate(20px,-20px) scale(1.08); }
  }

  /* ══════ SCREENS ══════ */
  .screen {
    position: fixed; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px; z-index: 10;
  }
  .screen.active { display: flex; }

  /* ══════ TITLE SCREEN ══════ */
  #scrTitle { gap: 12px; }
  .title-monsters {
    display: flex; gap: 0;
    font-size: clamp(60px,15vw,110px);
    margin-bottom: 4px;
    filter: drop-shadow(0 6px 20px rgba(0,0,0,0.5));
  }
  .title-monsters span {
    display: inline-block;
    animation: titleBounce 1.8s ease-in-out infinite;
  }
  .title-monsters span:nth-child(2) { animation-delay: 0.25s; }
  .title-monsters span:nth-child(3) { animation-delay: 0.5s; }
  @keyframes titleBounce {
    0%, 100% { transform: translateY(0) rotate(-8deg) scale(1); }
    50%       { transform: translateY(-18px) rotate(8deg) scale(1.1); }
  }
  h1.title-big {
    font-size: clamp(36px, 9vw, 70px);
    color: #fff;
    -webkit-text-stroke: 3px var(--purple-dark);
    text-shadow: 4px 6px 0 var(--purple), 0 8px 20px rgba(0,0,0,0.4);
    letter-spacing: 2px; text-align: center;
    animation: titleWiggle 4s ease-in-out infinite;
  }
  @keyframes titleWiggle {
    0%, 100% { transform: rotate(-1deg); }
    50%       { transform: rotate(1deg); }
  }
  .title-sub {
    font-size: clamp(15px,4vw,21px);
    color: #e9d5ff; font-weight: 900; text-align: center;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    max-width: 400px; line-height: 1.4;
  }
  .start-btn {
    background: linear-gradient(180deg, #c084fc, #7c3aed);
    color: #fff; border: 4px solid rgba(255,255,255,0.6);
    border-radius: 999px; padding: 18px 42px;
    font-size: clamp(22px, 5.5vw, 32px);
    font-weight: 900; font-family: inherit; cursor: pointer;
    box-shadow: 0 8px 0 #4c1d95, 0 14px 30px rgba(0,0,0,0.35);
    min-width: 210px; min-height: 70px;
    animation: startPulse 1.6s ease-in-out infinite;
    letter-spacing: 1px; margin-top: 8px;
  }
  @keyframes startPulse {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50%       { transform: scale(1.06); filter: brightness(1.12); }
  }
  .start-btn:active { transform: translateY(4px) scale(0.97); box-shadow: 0 4px 0 #4c1d95; animation: none; }

  /* ══════ GAME SCREEN ══════ */
  #scrGame {
    justify-content: flex-start;
    padding-top: calc(env(safe-area-inset-top) + 54px);
    padding-bottom: calc(env(safe-area-inset-bottom) + 8px);
    gap: 0;
  }

  /* Monster name badge */
  #nameDisplay {
    font-size: clamp(21px, 5.5vw, 33px);
    font-weight: 900; color: #fde68a;
    text-shadow: 2px 3px 0 #92400e, 0 6px 16px rgba(0,0,0,0.5);
    letter-spacing: 2px; min-height: 44px; text-align: center;
    margin-bottom: 4px;
  }
  #nameDisplay.pop { animation: namePop 0.5s var(--bounce) forwards; }
  @keyframes namePop {
    0%   { transform: scale(0.7) rotate(-5deg); opacity: 0; }
    60%  { transform: scale(1.15) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  #hintText {
    font-size: clamp(13px,3.2vw,16px); color: rgba(233,213,255,0.82);
    font-weight: 900; text-align: center;
    margin-bottom: 6px; letter-spacing: 0.4px; min-height: 22px;
  }

  /* ══════ MONSTER PARTS ══════ */
  #monsterWrap {
    display: flex; flex-direction: column;
    align-items: center; gap: 0;
    position: relative; z-index: 5;
  }

  .part-slot {
    position: relative;
    width: clamp(170px, 54vw, 270px);
    cursor: pointer;
    border-radius: 16px;
    transition: filter 0.15s;
    overflow: visible;
  }
  .part-slot:hover  { filter: brightness(1.12); }
  .part-slot:active { transform: scale(0.95); }

  /* Glowing border on hover */
  .part-slot::before {
    content: ''; position: absolute; inset: -4px;
    border-radius: 20px;
    border: 3px solid rgba(192,132,252,0);
    transition: border-color 0.2s;
    pointer-events: none; z-index: 2;
  }
  .part-slot:hover::before { border-color: rgba(192,132,252,0.6); }

  .part-slot svg { width: 100%; height: auto; display: block; overflow: visible; }

  /* Flip animation */
  .part-slot.flipping { animation: partFlip 0.32s ease-in-out; }
  @keyframes partFlip {
    0%   { transform: scaleY(1); }
    40%  { transform: scaleY(0.05); }
    60%  { transform: scaleY(0.05); }
    100% { transform: scaleY(1); }
  }

  /* Mix spin animation */
  .part-slot.mixing { animation: partSpin var(--spin-dur, 0.9s) ease-in-out; }
  @keyframes partSpin {
    0%   { transform: rotateY(0deg)   scale(1); }
    25%  { transform: rotateY(180deg) scale(0.82); }
    50%  { transform: rotateY(360deg) scale(1.06); }
    72%  { transform: rotateY(420deg) scale(0.96); }
    88%  { transform: rotateY(448deg) scale(1.02); }
    100% { transform: rotateY(360deg) scale(1); }
  }

  /* Tap hint — only on head slot */
  #slotHead::after {
    content: '👆'; position: absolute;
    right: -10px; top: 50%;
    transform: translateY(-50%);
    font-size: 22px; opacity: 0.75;
    pointer-events: none;
    animation: tapHint 1.4s ease-in-out infinite;
  }
  #slotHead.hint-hidden::after { display: none; }
  @keyframes tapHint {
    0%, 100% { transform: translateY(-50%) scale(1);    opacity: 0.75; }
    50%       { transform: translateY(-50%) scale(1.28); opacity: 1; }
  }

  /* ══════ BUTTONS ══════ */
  #btnArea {
    display: flex; flex-direction: column;
    align-items: center; gap: 10px;
    margin-top: 12px; z-index: 5;
  }

  .mix-btn {
    background: linear-gradient(180deg, #fde68a, #f59e0b);
    color: #78350f; border: 4px solid rgba(255,255,255,0.7);
    border-radius: 999px; padding: 15px 38px;
    font-size: clamp(20px, 5vw, 29px);
    font-weight: 900; font-family: inherit; cursor: pointer;
    box-shadow: 0 7px 0 #b45309, 0 12px 24px rgba(0,0,0,0.3);
    min-width: 200px; min-height: 64px; letter-spacing: 1px;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .mix-btn:active { transform: translateY(4px); box-shadow: 0 3px 0 #b45309; }
  .mix-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

  .another-btn {
    background: linear-gradient(180deg, #86efac, #22c55e);
    color: #14532d; border: 4px solid rgba(255,255,255,0.6);
    border-radius: 999px; padding: 13px 32px;
    font-size: clamp(16px, 4.5vw, 24px);
    font-weight: 900; font-family: inherit; cursor: pointer;
    box-shadow: 0 6px 0 #15803d, 0 10px 20px rgba(0,0,0,0.25);
    min-width: 175px; min-height: 56px; letter-spacing: 0.5px;
    opacity: 0; transform: scale(0.8);
    transition: opacity 0.4s var(--bounce), transform 0.4s var(--bounce);
    pointer-events: none;
  }
  .another-btn.visible { opacity: 1; transform: scale(1); pointer-events: auto; }
  .another-btn:active  { transform: scale(0.95) translateY(3px); }

  /* ══════ FX ══════ */
  .reveal-flash {
    position: fixed; inset: 0; z-index: 90;
    background: radial-gradient(circle at center, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0) 68%);
    pointer-events: none;
    animation: flashOut 0.6s ease-out forwards;
  }
  @keyframes flashOut {
    0%   { opacity: 1; transform: scale(1.2); }
    100% { opacity: 0; transform: scale(1); }
  }

  .sparkle {
    position: fixed; pointer-events: none; z-index: 80;
    animation: sparkleFly 0.8s ease-out forwards;
  }
  @keyframes sparkleFly {
    0%   { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--sx),var(--sy)) scale(0) rotate(360deg); opacity: 0; }
  }

  .confetti-piece {
    position: fixed; pointer-events: none; z-index: 85;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg) scale(0.4); opacity: 0.3; }
  }

  /* ══════ RESPONSIVE ══════ */
  @media (max-height: 640px) {
    #scrGame { padding-top: calc(env(safe-area-inset-top) + 46px); }
    #nameDisplay { font-size: 19px; margin-bottom: 2px; }
    #hintText { font-size: 12px; margin-bottom: 3px; }
    #btnArea { margin-top: 7px; gap: 7px; }
    .mix-btn { padding: 11px 28px; font-size: 18px; min-height: 52px; }
    .another-btn { padding: 9px 24px; font-size: 15px; min-height: 48px; }
    .part-slot { width: clamp(150px, 50vw, 240px); }
  }
</style>
</head>
<body>

<!-- Decorative BG blobs -->
<div class="bg-blob" style="width:380px;height:380px;top:-80px;left:-80px;background:#7c3aed;animation-duration:11s;"></div>
<div class="bg-blob" style="width:300px;height:300px;bottom:-60px;right:-60px;background:#ec4899;animation-duration:14s;animation-delay:-6s;"></div>
<div class="bg-blob" style="width:250px;height:250px;top:40%;left:55%;background:#0ea5e9;animation-duration:9s;animation-delay:-3s;"></div>

<a href="../../" class="back-home-btn">← Home</a>

<!-- ══════════════ TITLE SCREEN ══════════════ -->
<div class="screen active" id="scrTitle">
  <div class="title-monsters">
    <span>👾</span><span>🟣</span><span>👾</span>
  </div>
  <h1 class="title-big">MONSTER MIXER!</h1>
  <p class="title-sub">Build your very own silly monster — mix and match the parts!</p>
  <button class="start-btn" id="btnStart">Let's Mix! 🎲</button>
</div>

<!-- ══════════════ GAME SCREEN ══════════════ -->
<div class="screen" id="scrGame">

  <div id="nameDisplay">???</div>
  <div id="hintText">👆 Tap a part to change it!</div>

  <div id="monsterWrap">

    <!-- Head -->
    <div class="part-slot" id="slotHead">
      <svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" id="svgHead"></svg>
    </div>

    <!-- Body -->
    <div class="part-slot" id="slotBody">
      <svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" id="svgBody"></svg>
    </div>

    <!-- Legs -->
    <div class="part-slot" id="slotLegs">
      <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" id="svgLegs"></svg>
    </div>

  </div>

  <div id="btnArea">
    <button class="mix-btn" id="btnMix">🎲 Mix it!</button>
    <button class="another-btn" id="btnAnother">🔄 Make another!</button>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// MONSTER MIXER — Fun Zone
// Tap parts to cycle options; press Mix for random silly monsters!
// ═══════════════════════════════════════════════════════════════════

// ── UTILITIES ──────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const delay = ms => new Promise(r => setTimeout(r, ms));
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function randIndex(len, avoid) {
  if (len <= 1) return 0;
  let idx;
  do { idx = Math.floor(Math.random() * len); } while (idx === avoid);
  return idx;
}
function onTap(el, fn) {
  let locked = false;
  el.addEventListener('touchstart', e => {
    e.preventDefault(); if (locked) return;
    locked = true; fn(e); setTimeout(() => locked = false, 300);
  }, { passive: false });
  el.addEventListener('click', e => { if (!locked) fn(e); });
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  if (id) $(id).classList.add('active');
}

// ── AUDIO (AudioContext SFX) ────────────────────────────────────────
class GameAudio {
  constructor() { this.ctx = null; this.out = null; }
  _init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.out = this.ctx.createGain(); this.out.gain.value = 0.42; this.out.connect(this.ctx.destination);
  }
  unlock() { this._init(); if (this.ctx.state === 'suspended') this.ctx.resume(); }
  _tone(freq, t, dur, vol = 0.3, type = 'sine') {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.018);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); g.connect(this.out);
    o.start(t); o.stop(t + dur + 0.02);
    o.onended = () => { try { o.disconnect(); g.disconnect(); } catch(e){} };
  }
  click() {
    this._init(); const t = this.ctx.currentTime;
    this._tone(520, t, 0.08, 0.28, 'triangle');
    this._tone(800, t + 0.06, 0.09, 0.2, 'triangle');
  }
  mix() {
    this._init(); const t = this.ctx.currentTime;
    [380, 480, 600, 760, 960, 1200, 1520].forEach((f, i) =>
      this._tone(f, t + i * 0.1, 0.18, 0.2, 'sine'));
  }
  reveal() {
    this._init(); const t = this.ctx.currentTime;
    this._tone(523.25, t,     0.14, 0.32, 'sine');
    this._tone(659.25, t+0.1, 0.14, 0.36, 'sine');
    this._tone(783.99, t+0.2, 0.14, 0.4,  'sine');
    this._tone(1046.5, t+0.33,0.3,  0.46, 'sine');
    this._tone(1318.5, t+0.33,0.28, 0.4,  'triangle');
  }
  whoosh() {
    this._init(); const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(1100, t + 0.27);
    g.gain.setValueAtTime(0.28, t); g.gain.linearRampToValueAtTime(0, t + 0.3);
    o.connect(g); g.connect(this.out);
    o.start(t); o.stop(t + 0.32);
  }
  celebrate() {
    this._init(); const t = this.ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568].forEach((f, i) =>
      this._tone(f, t + i * 0.14, 0.22, 0.28 + i * 0.02, 'triangle'));
  }
}
const audio = new GameAudio();

// ── SPEECH ─────────────────────────────────────────────────────────
let voicesLoaded = false;
function ensureVoices() {
  if (voicesLoaded) return;
  voicesLoaded = true;
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
}
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.9; u.pitch = 1.3; u.volume = 1;
  const voices = speechSynthesis.getVoices();
  const pref = voices.find(v => /ava|samantha|karen|tessa|moira|allison|zira/i.test(v.name))
    || voices.find(v => v.lang.startsWith('en-US') && /female/i.test(v.name))
    || voices.find(v => v.lang.startsWith('en')) || null;
  if (pref) u.voice = pref;
  speechSynthesis.speak(u);
}
function unlockSpeech() {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(''); u.volume = 0;
  speechSynthesis.speak(u);
}

// ── NAME GENERATOR ─────────────────────────────────────────────────
const PREFIXES = ['Snorgle','Blobzo','Wiggle','Fumble','Grumble','Zippity','Bumble','Drizzy','Squiggle','Wacky'];
const SUFFIXES = ['fuzz','zorp','plop','snoot','kins','wump','grunt','blorp','fizz','doodle'];
const TITLES   = ['the Great','the Mighty','the Silly','the Wiggly','the Wobbly','the Fluffy'];
function generateName() {
  const pre = pick(PREFIXES), suf = pick(SUFFIXES);
  const tit = Math.random() < 0.38 ? ' ' + pick(TITLES) : '';
  return pre + suf + tit;
}

// ── VISUAL FX ──────────────────────────────────────────────────────
function spawnSparkles(x, y, n = 9) {
  const emojis = ['✨','⭐','💫','🌟','⚡','💥'];
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'sparkle'; el.textContent = pick(emojis);
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.fontSize = (14 + Math.random() * 16) + 'px';
    const ang = Math.random() * Math.PI * 2;
    const dist = 50 + Math.random() * 95;
    el.style.setProperty('--sx', Math.cos(ang) * dist + 'px');
    el.style.setProperty('--sy', Math.sin(ang) * dist + 'px');
    el.style.animationDelay = (Math.random() * 0.16) + 's';
    el.style.animationDuration = (0.55 + Math.random() * 0.45) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
}
function spawnConfetti(n = 48) {
  const set = ['🎉','⭐','🌈','💜','💛','🎊','💫','🟣','🔮'];
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece'; el.textContent = pick(set);
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.top = '-28px';
    el.style.fontSize = (15 + Math.random() * 14) + 'px';
    el.style.animationDuration = (2.3 + Math.random() * 2.8) + 's';
    el.style.animationDelay = (Math.random() * 1.4) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 6000);
  }
}
function revealFlash() {
  const el = document.createElement('div');
  el.className = 'reveal-flash';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

// ── SVG MONSTER PARTS ──────────────────────────────────────────────
// HEAD and BODY: viewBox "0 0 200 130"
// LEGS:          viewBox "0 0 200 100"

const HEADS = [

  // 0 ── Cyclops Horned (green)
  `<g>
    <polygon points="72,8 86,56 58,56" fill="#16a34a"/>
    <polygon points="128,8 142,56 114,56" fill="#16a34a"/>
    <ellipse cx="100" cy="90" rx="64" ry="52" fill="#4ade80"/>
    <ellipse cx="82" cy="72" rx="22" ry="14" fill="rgba(255,255,255,0.24)" transform="rotate(-22,82,72)"/>
    <circle cx="100" cy="88" r="26" fill="white"/>
    <circle cx="100" cy="88" r="17" fill="#2563eb"/>
    <circle cx="100" cy="88" r="10" fill="#0f172a"/>
    <circle cx="108" cy="80" r="5.5" fill="white"/>
    <circle cx="94"  cy="97" r="2.5" fill="rgba(255,255,255,0.7)"/>
    <path d="M 74 112 Q 100 127 126 112" stroke="#15803d" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="70"  cy="90" r="13" fill="rgba(134,239,172,0.55)"/>
    <circle cx="130" cy="90" r="13" fill="rgba(134,239,172,0.55)"/>
  </g>`,

  // 1 ── Antenna Monster (hot pink)
  `<g>
    <line x1="80"  y1="10" x2="72"  y2="50" stroke="#db2777" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="10" x2="128" y2="50" stroke="#db2777" stroke-width="4" stroke-linecap="round"/>
    <circle cx="80"  cy="9" r="11" fill="#f472b6"/>
    <circle cx="80"  cy="9" r="5.5" fill="#fce7f3"/>
    <circle cx="120" cy="9" r="11" fill="#f472b6"/>
    <circle cx="120" cy="9" r="5.5" fill="#fce7f3"/>

let headIdx = 0, bodyIdx = 0, legsIdx = 0;
let currentName = '???';
let mixBusy = false;
let tapCount = 0;

// ── RENDER ─────────────────────────────────────────────────────────
function renderPart(svgEl, parts, idx) { svgEl.innerHTML = parts[idx]; }
function renderAll() {
  renderPart($('svgHead'), HEADS, headIdx);
  renderPart($('svgBody'), BODIES, bodyIdx);
  renderPart($('svgLegs'), LEGS,  legsIdx);
}

// ── CYCLE PART ─────────────────────────────────────────────────────
async function cyclePart(slotId, svgId, parts, getIdx, setIdx) {
  if (mixBusy) return;
  audio.click();
  tapCount++;

  const slot = $(slotId), svg = $(svgId);
  const rect = slot.getBoundingClientRect();
  spawnSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2, 7);

  slot.classList.add('flipping');
  await delay(160);
  const next = (getIdx() + 1) % parts.length;
  setIdx(next);
  renderPart(svg, parts, next);
  await delay(170);
  slot.classList.remove('flipping');

  // Update hint text after first couple of taps
  if (tapCount === 2) $('hintText').textContent = '🎲 Press Mix it! for a surprise!';

  // Live name update
  updateName(false);
}

// ── NAME ───────────────────────────────────────────────────────────
function updateName(animate) {
  currentName = generateName();
  const el = $('nameDisplay');
  el.textContent = currentName;
  if (animate) {
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
  }
}

// ── MIX IT! ────────────────────────────────────────────────────────
async function doMix() {
  if (mixBusy) return;
  mixBusy = true;
  $('btnMix').disabled = true;
  $('btnAnother').classList.remove('visible');

  $('hintText').textContent = '🌀 Mixing…';
  audio.whoosh();

  // Hide tap hint during mix
  $('slotHead').classList.add('hint-hidden');

  const spinDurs = [900, 1060, 1220];
  const slots = ['slotHead','slotBody','slotLegs'];

  // Trigger staggered spin animations
  slots.forEach((id, i) => {
    const el = $(id);
    el.style.setProperty('--spin-dur', spinDurs[i] + 'ms');
    setTimeout(() => el.classList.add('mixing'), i * 85);
  });

  audio.mix();

  // Pick new random indices (different from current)
  const nH = randIndex(HEADS.length, headIdx);
  const nB = randIndex(BODIES.length, bodyIdx);
  const nL = randIndex(LEGS.length,  legsIdx);

  // Swap SVG content mid-spin
  setTimeout(() => { headIdx = nH; renderPart($('svgHead'), HEADS, headIdx); }, spinDurs[0] / 2);
  setTimeout(() => { bodyIdx = nB; renderPart($('svgBody'), BODIES, bodyIdx); }, spinDurs[1] / 2 + 85);
  setTimeout(() => { legsIdx = nL; renderPart($('svgLegs'), LEGS,  legsIdx); }, spinDurs[2] / 2 + 170);

  await delay(spinDurs[2] + 170 + 80);
  slots.forEach(id => $(id).classList.remove('mixing'));

  // Big reveal moment
  revealFlash();
  audio.reveal();
  spawnConfetti(52);
  updateName(true);

  await delay(380);
  $('hintText').textContent = '👆 Tap parts to change them!';
  $('slotHead').classList.remove('hint-hidden');

  speak('Meet your monster! ' + currentName + '!');

  await delay(900);
  audio.celebrate();

  $('btnMix').disabled = false;
  mixBusy = false;
  setTimeout(() => $('btnAnother').classList.add('visible'), 350);
}

// ── MAKE ANOTHER ───────────────────────────────────────────────────
async function doAnother() {
  if (mixBusy) return;
  audio.whoosh();
  $('btnAnother').classList.remove('visible');
  spawnConfetti(22);
  await delay(120);
  await doMix();
}

// ── START GAME ─────────────────────────────────────────────────────
function startGame() {
  headIdx = Math.floor(Math.random() * HEADS.length);
  bodyIdx = Math.floor(Math.random() * BODIES.length);
  legsIdx = Math.floor(Math.random() * LEGS.length);
  renderAll();
  $('nameDisplay').textContent = '???';
  $('hintText').textContent = '👆 Tap a part to change it!';
  $('btnAnother').classList.remove('visible');
  tapCount = 0;
  showScreen('scrGame');
}

// ── EVENT LISTENERS ────────────────────────────────────────────────
onTap($('btnStart'), () => {
  audio.unlock(); unlockSpeech(); audio.whoosh(); startGame();
});

onTap($('slotHead'), () => cyclePart('slotHead','svgHead', HEADS, ()=>headIdx, v=>headIdx=v));
onTap($('slotBody'), () => cyclePart('slotBody','svgBody', BODIES, ()=>bodyIdx, v=>bodyIdx=v));
onTap($('slotLegs'), () => cyclePart('slotLegs','svgLegs', LEGS,  ()=>legsIdx, v=>legsIdx=v));
onTap($('btnMix'),     doMix);
onTap($('btnAnother'), doAnother);

// Pre-load speech voices
if ('speechSynthesis' in window) {
  speechSynthesis.getVoices();
  if ('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = () => {};
}

/* ═══ AHA! PROGRESS TRACKING ═══ */
(function(){
  function getKey(){
    var parts=location.pathname.split('/').filter(Boolean);
    var last=parts[parts.length-1]||'index.html';
    var game=last.replace('.html','');
    var theme=parts[parts.length-2]||'root';
    return theme+'/'+game;
  }
  function load(){try{return JSON.parse(localStorage.getItem('aha_progress')||'{}')}catch(e){return{}}}
  function save(p){try{localStorage.setItem('aha_progress',JSON.stringify(p))}catch(e){}}
  function markAttempt(){
    var p=load(),k=getKey();
    if(!p[k])p[k]={attempted:true,attemptedAt:Date.now()};
    save(p);
  }
  function markComplete(){
    var p=load(),k=getKey();
    if(!p[k])p[k]={};
    p[k].completed=true; p[k].completedAt=Date.now();
    p[k].plays=(p[k].plays||0)+1;
    save(p);
  }
  document.getElementById('btnMix').addEventListener('click',function(){markComplete();},{once:true});
  setTimeout(markAttempt,3000);
})();
</script>
